name: rxjava3

on:
  push:
    paths:
      - "rxjava3/**"
    branches:
      - master
  pull_request:
    paths:
      - "rxjava3/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: blogdb
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/pg-initdb.d:/docker-entrypoint-initdb.d
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
          
        
      - name: Test with CURL
        run: |
            mvn clean package exec:java -DskipTests --file rxjava3/pom.xml & 
            sleep 10
            echo ">>> print cURL result <<<"
            curl http://localhost:8888/hello & 
      
      - name: Build rxjava3
        run: mvn clean install --file rxjava3/pom.xml      
