name: kotlin-co

on:
  push:
    paths:
      - "kotlin-co/**"
    branches:
      - master
  pull_request:
    paths:
      - "kotlin-co/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: blogdb
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/pg-initdb.d:/docker-entrypoint-initdb.d
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
          
      - name: Build kotlin-co
        run: mvn clean install --file kotlin-co/pom.xml
